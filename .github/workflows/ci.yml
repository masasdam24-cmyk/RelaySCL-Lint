name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify valid SCL
        run: python relayscl_lint.py examples/valid.scd
      - name: Verify invalid SCL is rejected
        run: |
          if python relayscl_lint.py examples/broken.scd; then
            echo 'Expected an error exit code' >&2
            exit 1
          fi
